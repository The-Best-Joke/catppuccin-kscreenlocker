<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!-- back person (smaller, offset right) -->
  <circle cx="16.5" cy="7" r="2.8"/>
  <path d="M16.5 11
           c -1.4 0 -2.6 0.4 -3.5 1
           c 0.9 0.9 1.5 2 1.7 3.1
           h 5.8
           v -0.6
           c 0 -2 -1.8 -3.5 -4 -3.5
           Z"/>
  <!-- front person (larger) -->
  <circle cx="9" cy="8.2" r="3.4"/>
  <path d="M9 13
           c -3.5 0 -6.5 1.8 -6.5 4.2
           v 1.8
           h 13
           v -1.8
           c 0 -2.4 -3 -4.2 -6.5 -4.2
           Z"/>
</svg>
