  Snowflake (hibernate / suspend-to-disk action button).
  Three rounded bars at 0deg, 60deg, 120deg, each as an independent
  <rect> with its own rotate() transform. No nested groups; QtSvg has
  historically been flaky with stacked transforms.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <rect x="11" y="2" width="2" height="20" rx="1"/>
  <rect x="11" y="2" width="2" height="20" rx="1" transform="rotate(60 12 12)"/>
  <rect x="11" y="2" width="2" height="20" rx="1" transform="rotate(120 12 12)"/>
</svg>
